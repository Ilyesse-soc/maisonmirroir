name: Targeted production purchase browser check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  iphone-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      # Public browsing, cart edits, promotion quotes and genuine relay search.
      # No admin credentials, PayPal order, payment or label creation.
      - run: node scripts/verify-purchase-flow.cjs webkit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: iphone-webkit-purchase-check
          path: .qa/purchase-webkit-*
          retention-days: 7
