worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  access_log off;
  sendfile on;
  keepalive_timeout 15;
  client_max_body_size 64k;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_certificate /etc/nginx/tls/server.crt;
  ssl_certificate_key /etc/nginx/tls/server.key;
  ssl_session_cache shared:TLS:4m;
  ssl_session_tickets off;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server {
    listen 8080 default_server;
    server_name _;
    location = /proxy-health { return 200 'ok'; }
    location / { return 308 https://maison-miroir.fr$request_uri; }
  }
  server {
    listen 8443 ssl default_server;
    server_name _;
    return 444;
  }
  server {
    listen 8443 ssl;
    server_name www.maison-miroir.fr;
    return 308 https://maison-miroir.fr$request_uri;
  }
  server {
    listen 8443 ssl;
    server_name maison-miroir.fr;
    location / {
      set $backend app:3000;
      proxy_pass http://$backend;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
    }
  }
}
